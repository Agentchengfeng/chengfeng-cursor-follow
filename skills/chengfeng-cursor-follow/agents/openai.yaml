interface:
  display_name: "chengfeng · 跟随鼠标转头"
  short_description: "先确认角色图，再做左右转头视频（本地生成或引导用户），做成跟随鼠标的网页"
  default_prompt: "使用 $chengfeng-cursor-follow 把这个角色做成跟着鼠标转头的网页：先确认是否有现成主角图，没有就生成；图准备好后，本地有图生视频工具就直接生成看左/看右两段，没有就引导用户用图生视频、以这张图作首帧生成；拿到视频后抽帧并套用页面模板。"
policy:
  allow_implicit_invocation: true
