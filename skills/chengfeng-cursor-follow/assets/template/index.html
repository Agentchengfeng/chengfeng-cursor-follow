<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 文案：按角色替换 -->
<title>盯着你的角色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* --bg / --shade 由 frames/config.js 覆盖为视频背景色；深色背景用这套浅色字 */
  :root {
    --bg: #7d161c;
    --shade: #44000a;
    --ink: #fff7ee;
    --muted: rgba(255, 247, 238, .62);
    --line: rgba(255, 247, 238, .18);
    --accent: #f4c542;
    --accent-ink: #2a0a0d;
    --glass: rgba(255, 255, 255, .08);
    --btn: rgba(0, 0, 0, .55);
  }
  /* 视频背景偏浅时（config.lightBackground）切换成深色字 */
  :root[data-bg="light"] {
    --ink: #17120f;
    --muted: rgba(23, 18, 15, .6);
    --line: rgba(23, 18, 15, .16);
    --glass: rgba(255, 255, 255, .45);
    --btn: #17120f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 Inter, system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
  }

  /* 帧序列画布：按鼠标横坐标切帧 */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, color-mix(in srgb, var(--shade) 70%, transparent) 100%);
  }

  #loader {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); z-index: 20; transition: opacity .6s;
    font-size: 12px; letter-spacing: .2em; color: var(--muted);
  }
  #loader.done { opacity: 0; pointer-events: none; }

  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .ui a, .ui button { pointer-events: auto; cursor: none; }

  nav {
    position: absolute; top: 20px; left: 24px; right: 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pills { display: flex; gap: 6px; }
  .pill {
    font: 500 11px Inter; letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 999px; color: var(--ink);
    background: var(--glass); border: 1px solid var(--line); text-decoration: none;
  }
  .pill.on { background: var(--ink); color: var(--bg); }
  .brand { font: 600 15px Inter; letter-spacing: .02em; }
  .brand b { color: var(--accent); font-weight: 600; }

  .hero { position: absolute; left: 5vw; top: 50%; transform: translateY(-58%); max-width: 360px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; font: 500 11px Inter; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  h1 {
    font-family: Anton, Impact, sans-serif; font-weight: 400;
    font-size: clamp(56px, 8vw, 120px); line-height: .92; margin: 14px 0 18px;
    letter-spacing: .01em; text-transform: uppercase;
  }
  h1 span { display: block; }
  h1 .y { color: var(--accent); }
  .hero p { color: var(--muted); font-size: 13px; max-width: 300px; }

  .cta { position: absolute; left: 5vw; bottom: 36px; display: flex; gap: 12px; align-items: center; }
  .btn { font: 500 12px Inter; letter-spacing: .1em; text-transform: uppercase; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--btn); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }

  .side { position: absolute; right: 5vw; top: 22vh; width: 220px; }
  .side h3 { font: 600 14px Inter; margin: 10px 0 4px; }
  .side small { color: var(--muted); font-size: 11px; }

  .cards { position: absolute; right: 24px; bottom: 28px; display: flex; gap: 10px; }
  .card {
    width: 150px; height: 170px; border-radius: 8px; padding: 12px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .card b { font: 600 13px/1.2 Inter; }
  .card small { color: var(--muted); font-size: 11px; }

  /* 角度读数 + 旋转提示 */
  .readout { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); text-align: center; }
  .ring { width: 96px; height: 96px; animation: spin 14s linear infinite; }
  .ring text { fill: var(--muted); font: 500 9.5px Inter; letter-spacing: .28em; text-transform: uppercase; }
  .deg { position: absolute; inset: 0; display: grid; place-items: center; font: 500 11px Inter; letter-spacing: .06em; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #cursor {
    position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border: 1.5px solid var(--ink); border-radius: 50%; pointer-events: none; z-index: 30;
    display: grid; place-items: center;
  }
  #cursor::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }

  @media (max-width: 820px) {
    body { cursor: auto; }
    #cursor, .side, .cards { display: none; }
    .hero { left: 16px; right: 16px; top: 16vh; transform: none; }
    .cta { left: 16px; }
    .readout { left: auto; right: 16px; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
<script src="frames/config.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>
<div id="loader">LOADING <span id="pct">0</span>%</div>

<!-- 文案：以下所有文字按角色和用途替换；不需要的块可以整块删掉 -->
<div class="ui">
  <nav>
    <div class="pills"><a class="pill on" href="#">Home</a><a class="pill" href="#">Story</a></div>
    <div class="brand">● your<b>brand</b></div>
    <div class="pills"><a class="pill" href="#">Contact</a></div>
  </nav>

  <section class="hero">
    <div class="tag"><i></i>Move your cursor</div>
    <h1><span>Look.</span><span>Over.</span><span class="y">Here.</span></h1>
    <p>一句话介绍这个角色。动动鼠标，它的视线会一直跟着你。</p>
  </section>

  <div class="cta"><button class="btn">Get started →</button><button class="btn ghost">Learn more</button></div>

  <aside class="side">
    <h3>右上角短句</h3>
    <small>一行补充说明</small>
  </aside>

  <div class="cards">
    <div class="card"><b>卡片标题一</b><small>卡片说明文字。</small></div>
    <div class="card"><b>卡片标题二</b><small>卡片说明文字。</small></div>
  </div>

  <div class="readout">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="c" d="M50,50 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0"/></defs>
      <text><textPath href="#c">move your cursor · watching you ·</textPath></text>
    </svg>
    <div class="deg" id="deg">0°</div>
  </div>
</div>
<div id="cursor"></div>

<script>
(() => {
  // 帧序列：frames/f000.jpg ... 从最左到最右排列，中间帧 = 正视。参数来自 build_frames.py 生成的 frames/config.js
  const CFG = Object.assign({
    count: 121, pattern: "frames/f{i}.jpg", pad: 3, maxDeg: 40,
    bgInner: "#7a0a1a", bgOuter: "#44000a", lightBackground: false,
  }, window.FRAMES_CONFIG || {});
  const FRAME_COUNT = CFG.count;
  const SUBJECT_HEIGHT = 0.88;   // 角色帧占视口高度的比例，贴底居中
  const EASE = 0.12;             // 视线跟随的缓动系数，越小越“慢半拍”

  const root = document.documentElement;
  root.style.setProperty("--bg", CFG.bgInner);
  root.style.setProperty("--shade", CFG.bgOuter);
  if (CFG.lightBackground) root.dataset.bg = "light";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const off = document.createElement("canvas");
  const octx = off.getContext("2d");
  const frames = new Array(FRAME_COUNT);
  let loaded = 0;

  let target = 0, cur = 0;   // 鼠标横坐标，-1（最左）..1（最右）
  let lastDrawn = -1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    lastDrawn = -1;
  }

  function draw(i) {
    const img = frames[i];
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = canvas.width, ch = canvas.height;
    const s = Math.min((ch * SUBJECT_HEIGHT) / img.naturalHeight, (cw * 0.9) / img.naturalWidth);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    const x = (cw - w) / 2, top = ch - h;
    // 页面背景：与帧边缘同色的径向渐变
    const bg = ctx.createRadialGradient(cw / 2, ch * 0.45, 0, cw / 2, ch * 0.45, Math.max(cw, ch) * 0.7);
    bg.addColorStop(0, CFG.bgInner);
    bg.addColorStop(1, CFG.bgOuter);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);
    // 帧先画进离屏画布，用 alpha 蒙版把左右和顶部边缘羽化成透明，不抠像
    const ow = Math.round(w), oh = Math.round(h + ch * 0.02);
    if (off.width !== ow || off.height !== oh) { off.width = ow; off.height = oh; }
    octx.globalCompositeOperation = "source-over";
    octx.clearRect(0, 0, ow, oh);
    octx.drawImage(img, 0, 0, ow, oh);
    octx.globalCompositeOperation = "destination-in";
    const gx = octx.createLinearGradient(0, 0, ow, 0);
    gx.addColorStop(0, "rgba(0,0,0,0)");
    gx.addColorStop(0.2, "rgba(0,0,0,1)");
    gx.addColorStop(0.8, "rgba(0,0,0,1)");
    gx.addColorStop(1, "rgba(0,0,0,0)");
    octx.fillStyle = gx;
    octx.fillRect(0, 0, ow, oh);
    const gy = octx.createLinearGradient(0, 0, 0, oh);
    gy.addColorStop(0, "rgba(0,0,0,0)");
    gy.addColorStop(0.18, "rgba(0,0,0,1)");
    gy.addColorStop(1, "rgba(0,0,0,1)");
    octx.fillStyle = gy;
    octx.fillRect(0, 0, ow, oh);
    ctx.drawImage(off, x, top);
  }

  function tick() {
    cur += (target - cur) * EASE;
    const i = Math.round((cur + 1) / 2 * (FRAME_COUNT - 1));
    if (i !== lastDrawn) {
      draw(i);
      lastDrawn = i;
      const d = Math.round(cur * CFG.maxDeg);
      document.getElementById("deg").textContent =
        d === 0 ? "0°" : `${Math.abs(d)}° ${d < 0 ? "LEFT" : "RIGHT"}`;
    }
    requestAnimationFrame(tick);
  }

  const cursorEl = document.getElementById("cursor");
  function point(px, py) {
    target = Math.max(-1, Math.min(1, (px / innerWidth) * 2 - 1));
    cursorEl.style.transform = `translate(${px}px, ${py}px)`;
  }
  addEventListener("pointermove", e => point(e.clientX, e.clientY));
  addEventListener("touchmove", e => { const t = e.touches[0]; point(t.clientX, t.clientY); }, { passive: true });
  addEventListener("resize", resize);

  // 先加载中间帧马上显示，其余从中间往两侧加载
  const mid = Math.floor(FRAME_COUNT / 2);
  const order = [mid];
  for (let k = 1; k <= mid + 1; k++) {
    if (mid - k >= 0) order.push(mid - k);
    if (mid + k < FRAME_COUNT) order.push(mid + k);
  }
  order.forEach(i => {
    const img = new Image();
    img.onload = () => {
      loaded++;
      document.getElementById("pct").textContent = Math.round(loaded / FRAME_COUNT * 100);
      if (loaded === FRAME_COUNT) document.getElementById("loader").classList.add("done");
      if (i === mid) lastDrawn = -1;
    };
    img.src = CFG.pattern.replace("{i}", String(i).padStart(CFG.pad, "0"));
    frames[i] = img;
  });

  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
